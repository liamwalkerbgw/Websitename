[[redirects]]
  from = "/ig"
  to = "/links/?utm_source=instagram&utm_medium=bio"
  status = 302
  force = true

[[redirects]]
  from = "/fb"
  to = "/links/?utm_source=facebook&utm_medium=page"
  status = 302
  force = true

[[redirects]]
  from = "/in"
  to = "/links/?utm_source=linkedin&utm_medium=profile"
  status = 302
  force = true
# Netlify settings for roccoandliambgw.com (static site, no build step)

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000"

# Images and icons rarely change: cache for a week
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Scripts change when IDs are added: always re-check
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/thank-you/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Send any old netlify.app links and www to the main domain
[[redirects]]
  from = "https://roccoandliamwebsite.netlify.app/*"
  to = "https://roccoandliambgw.com/:splat"
  status = 301
  force = true

# Audience landing pages. Until each page exists, visitors are sent to the
# homepage contact section. Once /smsf/index.html (etc.) is uploaded, Netlify
# serves the real page automatically and this rule is ignored.
[[redirects]]
  from = "/smsf/*"
  to = "/?from=smsf#contact"
  status = 302
[[redirects]]
  from = "/business-owners/*"
  to = "/?from=business-owners#contact"
  status = 302
[[redirects]]
  from = "/retirees/*"
  to = "/?from=retirees#contact"
  status = 302
[[redirects]]
  from = "/families/*"
  to = "/?from=families#contact"
  status = 302
